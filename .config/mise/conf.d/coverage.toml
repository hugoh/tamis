COVERAGE_MIN_LINES = "90"
COVERAGE_IGNORE_REGEX = '(^|/)(main|tamis-eval)\.rs$|src/eval/net\.rs$|src/mail/(client|tasks)\.rs$|src/probe/live\.rs$|src/cli/commands/probe\.rs$'
