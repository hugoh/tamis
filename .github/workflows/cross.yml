---
name: cross

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cross-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Limitation: this filter only lists build inputs (dependencies, toolchain,
  # release config), not `src/**`, so a pull request that changes only source
  # skips the anodizer legs and `cross-gate` passes trivially. Platform-specific
  # code that compiles on the `test` job's runner but not on a release target
  # (or macOS) is therefore not caught until a build-relevant change or the
  # release itself. Add `src/**` to the filter below to build
  # every release target on every code change, at the cost of the 30-minute,
  # two-OS matrix on each one.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - mise.toml
              - .anodizer.yaml
              - .github/workflows/cross.yml

  anodizer:
    name: anodizer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MISE_ENV: release,package
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "1"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: anodizer-${{ matrix.os }}
      - run: anodizer check config
      - name: Build this runner's targets natively
        run: anodizer release --split --snapshot --clean

  # Stable check name for branch protection: matrix leg names carry the runner
  # label, and a skipped `anodizer` job (unrelated paths) posts no check at
  # all. This wrapper always runs and passes trivially when the build was
  # skipped, so it's what's pinned as the required context.
  cross-gate:
    if: always()
    needs: [changes, anodizer]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every anodizer leg to have passed, when relevant
        env:
          BUILD_CHANGED: ${{ needs.changes.outputs.build }}
          ANODIZER_RESULT: ${{ needs.anodizer.result }}
        run: |
          set -euo pipefail
          echo "build_changed=$BUILD_CHANGED anodizer=$ANODIZER_RESULT"
          if [ "$BUILD_CHANGED" != "true" ]; then
            echo "no build-relevant changes; skipping"
            exit 0
          fi
          [ "$ANODIZER_RESULT" = success ] || exit 1
