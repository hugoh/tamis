<div id="result" aria-live="polite">{% if !result.problem.is_empty() %}<div role="alert" class="alert alert-warning alert-soft my-2"><span>{{ result.problem }}</span></div>{% else if !result.folder.is_empty() %}<div role="status" class="alert alert-success alert-soft my-2"><span>Filed into <strong>{{ result.folder }}</strong></span></div>{% else %}<div role="status" class="alert alert-info alert-soft my-2"><span>Stays in the inbox</span></div>{% endif %}</div>
