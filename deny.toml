[graph]
# The platforms tamis ships (.anodizer.yaml); others only add duplicates.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant was merged into zbus 6; secret-service (via keyring) still pins zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names was merged into zbus 6; secret-service (via keyring) still pins zbus 5" },
  { id = "RUSTSEC-2023-0071", reason = "rsa (via webauthn-rs) only verifies public-key signatures here; the timing leak is in private-key operations tamis never performs" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is askama's build-time parser of its own config, not part of the shipped binary" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive was merged into zbus 6; secret-service (via keyring) still pins zbus 5" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "AGPL-3.0-only", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
