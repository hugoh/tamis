<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'>
<title>tamis · {{ title }}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ version }}">
<link rel="stylesheet" href="/static/vendor/theme.css?v={{ version }}">
<link rel="stylesheet" href="/static/decisions.css?v={{ version }}">
</head>
<body class="min-h-screen">
<header class="navbar flex-wrap bg-base-200 shadow-sm px-4">
<div class="flex-1"><span class="text-xl font-semibold">tamis</span></div>
{% if !nav.is_empty() %}<div class="flex flex-wrap items-center gap-2">
<nav aria-label="Main">
<ul class="menu menu-horizontal flex-wrap">
<li><a href="/"{% if nav == "decisions" %} class="menu-active" aria-current="page"{% endif %}>Decisions</a></li>
<li><a href="/health"{% if nav == "health" %} class="menu-active" aria-current="page"{% endif %}>Health</a></li>
<li><a href="/whitelist"{% if nav == "whitelist" %} class="menu-active" aria-current="page"{% endif %}>Whitelist</a></li>
<li><a href="/rules"{% if nav == "rules" %} class="menu-active" aria-current="page"{% endif %}>Rules</a></li>
<li><a href="/logs"{% if nav == "logs" %} class="menu-active" aria-current="page"{% endif %}>Logs</a></li>
</ul>
</nav>
<form method="post" action="/auth/logout"><button class="btn btn-ghost btn-sm">Sign out</button></form>
</div>{% endif %}
</header>
<main class="mx-auto max-w-screen-2xl p-4" tabindex="-1">
{% block content %}{% endblock %}
</main>
{% if !version.is_empty() %}<footer class="p-4 text-center text-xs opacity-60"><a class="link link-hover" href="https://tamis.larve.net/">tamis</a> {{ version }}</footer>{% endif %}
<div id="toasts" class="toast toast-end" popover="manual" role="region" aria-label="Notifications"></div>
<div id="toast-status" class="sr-only" role="status"></div>
<script src="/static/vendor/htmx.min.js?v={{ version }}"></script>
<script src="/static/feedback.js?v={{ version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
