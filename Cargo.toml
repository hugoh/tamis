[package]
name = "tamis"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "A second-opinion spam filter and mail sorter for remote mailboxes"
repository = "https://github.com/hugoh/tamis"
license = "AGPL-3.0-only"
publish = false

[dependencies]
fastrand = "2.5.0"
html5ever = "0.40.1"
jiff = "0.2.39"
keyring = "4.2.0"
keyring-core = "1.0.1"
mail-parser = "0.11.9"
psl = "2.1.246"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
unicode-general-category = "1.1.0"
url = "2.5.8"

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
