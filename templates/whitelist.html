{% extends "layout.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Whitelist</h1>
<div class="flex flex-wrap items-center gap-3 mb-2">

<form id="toolbar" hx-get="/whitelist" hx-target="#results" hx-swap="outerHTML" hx-push-url="true" hx-include="#toolbar">

</div>

{% include "whitelist_results.html" %}
{% endblock %}
