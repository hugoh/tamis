name: Pages

on:
  push:
    branches: [main]
    paths: &site-paths [site/**, site-docs/**, docs/**, templates/**, src/web/**, web/static/**, mise-tasks/site/**, .github/workflows/pages.yml]
  pull_request:
    branches: [main]
    paths: *site-paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "1"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: pages
      - run: mise run site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
