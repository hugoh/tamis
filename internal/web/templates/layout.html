{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'>
<title>tamis · {{.Title}}</title>
<link rel="stylesheet" href="/static/vendor/theme.css">
</head>
<body class="min-h-screen">
<div class="navbar bg-base-200 shadow-sm px-4">
<div class="flex-1"><span class="text-xl font-semibold">tamis</span></div>
{{if .Nav}}<div class="flex-none flex items-center gap-2">
<ul class="menu menu-horizontal">
<li><a href="/"{{if eq .Nav "decisions"}} class="menu-active"{{end}}>Decisions</a></li>
<li><a href="/health"{{if eq .Nav "health"}} class="menu-active"{{end}}>Health</a></li>
<li><a href="/whitelist"{{if eq .Nav "whitelist"}} class="menu-active"{{end}}>Whitelist</a></li>
<li><a href="/rules"{{if eq .Nav "rules"}} class="menu-active"{{end}}>Rules</a></li>
<li><a href="/logs"{{if eq .Nav "logs"}} class="menu-active"{{end}}>Logs</a></li>
</ul>
<form method="post" action="/auth/logout"><button class="btn btn-ghost btn-sm">Sign out</button></form>
</div>{{end}}
</div>
<main class="mx-auto max-w-screen-2xl p-4">
{{template "content" .}}
</main>
{{if .Version}}<footer class="p-4 text-center text-xs opacity-60">tamis {{.Version}}</footer>{{end}}
<script src="/static/vendor/htmx.min.js"></script>
{{block "scripts" .}}{{end}}
</body>
</html>{{end}}
