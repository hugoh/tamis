---
name: rust-setup
description: Install the pinned Rust toolchain and restore the shared cargo cache.
inputs:
  cache:
    description: Restore the cargo cache; "false" installs the toolchain only.
    default: "true"
  shared-key:
    description: Swatinem/rust-cache shared-key. Not needed when cache is "false".
    default: ""
  save-if:
    description: Whether this run may save the cache.
    default: ${{ github.ref == 'refs/heads/main' }}
  minimal:
    description: Skip the clippy, rustfmt and llvm-tools components that rust-toolchain.toml adds.
    default: "false"
runs:
  using: composite
  steps:
    - if: inputs.minimal != 'true'
      run: rustup toolchain install
      shell: bash
    - if: inputs.minimal == 'true'
      run: |
        channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal
        rustup override set "$channel"
      shell: bash
    - if: inputs.cache != 'false'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
