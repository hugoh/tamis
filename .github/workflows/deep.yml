---
name: deep

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [tokenize, rules_parse, utf7_roundtrip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "1"
      - uses: ./.github/actions/rust-setup
        with:
          cache: "false"
      - run: mise run fuzz ${{ matrix.target }} 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  mutants:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "1"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: mutants
          save-if: "false"
      - run: mise run prebuild
      - run: mise run mutants
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
