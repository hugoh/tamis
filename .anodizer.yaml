# yaml-language-server: $schema=https://raw.githubusercontent.com/tj-smith47/anodizer/main/schema.json
# Releases run in ci.yml: one --split build per OS on native runners, then a
# --merge job that publishes.
project_name: tamis
dist: ./dist

before:
  hooks:
    - mise run prebuild

defaults:
  targets:
    - x86_64-unknown-linux-gnu
    - aarch64-unknown-linux-gnu
    - aarch64-apple-darwin
  cross: cargo

partial:
  by: target

crates:
  - name: tamis
    path: .
    tag_template: "v{{ .Version }}"
    builds:
      - binary: tamis
        flags: ["--release"]
        env:
          x86_64-unknown-linux-gnu: &version {TAMIS_VERSION: "{{ .Version }}"}
          aarch64-unknown-linux-gnu: *version
          aarch64-apple-darwin: *version
    archives:
      - name_template: "tamis_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    nfpms:
      - maintainer: "Hugo Haas <hugoh@hugoh.net>"
        description: "A second-opinion spam filter and mail sorter for remote mailboxes"
        homepage: "https://github.com/hugoh/tamis"
        license: "AGPL-3.0-only"
        formats: [deb, rpm]
        bindir: /usr/bin
        contents:
          - src: packaging/tamis.service
            dst: /usr/lib/systemd/system/tamis.service
          - src: packaging/tamis.sysusers
            dst: /usr/lib/sysusers.d/tamis.conf
          - src: packaging/README.systemd.md
            dst: /usr/share/doc/tamis/README.systemd.md
        scripts:
          postinstall: packaging/postinstall.sh
          preremove: packaging/preremove.sh
    release:
      preflight:
        fail_on_error: false
      github:
        owner: hugoh
        name: tamis
    publish:
      cargo:
        auth: oidc
        # The prebuilt web assets are gitignored but shipped through Cargo.toml's include list.
        allow_dirty: true
      homebrew:
        repository:
          owner: hugoh
          name: homebrew-tap
          token: "{{ .Env.TAP_GITHUB_TOKEN }}"
          pull_request:
            enabled: true
        required: true
        directory: Formula
        description: "A second-opinion spam filter and mail sorter for remote mailboxes"
        homepage: "https://github.com/hugoh/tamis"
        license: "AGPL-3.0-only"

cloudsmiths:
  - organization: hugoh-oss
    repository: tamis
    formats: [deb, rpm]
    # Cloudsmith requires a distribution for deb/rpm uploads (HTTP 422
    # "distribution: This field is required"); any-distro/any-version matches
    # what the setup.deb.sh / setup.rpm.sh install scripts serve.
    distributions:
      deb: any-distro/any-version
      rpm: any-distro/any-version
    secret_name: CLOUDSMITH_API_KEY
    required: true

verify_release:
  enabled: true

git:
  tag_sort: smartsemver

tag:
  tag_prefix: v
  bump_minor_pre_major: true

changelog:
  sort: asc
  groups:
    - {title: "⚠️ Breaking Changes", regexp: '^.*?(\w+)(\(.+\))??!:.+$', order: 0}
    - {title: Features, regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$', order: 1}
    - {title: Bug Fixes, regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$', order: 2}
    - {title: Documentation, regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$', order: 3}
    - {title: Dependency Updates, regexp: '^.*?(feat|fix|chore)\(deps\).*:.+$', order: 900}
    - {title: Others, order: 999}
  filters:
    exclude:
      - "^chore\\(release\\): prepare for"
      - "^chore\\(deps"
      - "Merge pull request"
      - "Merge branch"
