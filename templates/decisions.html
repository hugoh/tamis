{% extends "layout.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Decisions</h1>
<form id="toolbar" class="flex flex-wrap items-center gap-3" hx-get="/" hx-target="#results" hx-swap="outerHTML" hx-push-url="true" hx-include="#toolbar" hx-disabled-elt="#toolbar button[type=submit]">
<input type="search" name="q" value="{{ body.search }}" placeholder="Search folder, sender, subject, reason…" aria-label="Search" class="input input-sm w-72" hx-get="/" hx-trigger="input changed delay:300ms, search">
<div class="join">
{% for choice in body.verdicts %}<input class="join-item btn btn-sm" type="radio" name="verdict" value="{{ choice.value }}" aria-label="{{ choice.label }}"{% if choice.checked %} checked{% endif %} hx-get="/" hx-trigger="change">
{% endfor %}</div>
<select name="reason" aria-label="Reason" class="select select-sm w-auto" hx-get="/" hx-trigger="change">
{% for choice in body.reasons %}<option value="{{ choice.value }}"{% if choice.checked %} selected{% endif %}>{% if choice.value.is_empty() %}Any reason{% else %}{{ choice.value }}{% endif %}</option>
{% endfor %}</select>
<button type="submit" class="btn btn-sm">Refresh</button>
</form>
{% include "decisions_results.html" %}
{% endblock %}
