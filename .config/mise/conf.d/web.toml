# Front-end files tamis embeds (internal/web/static/vendor). Renovate bumps the
# versions; run `mise run vendor-web` to copy htmx and rebuild the stylesheet.
# The results are committed, so building tamis needs none of this.
[tools]
"npm:@tailwindcss/cli" = "4.3.3"
"npm:daisyui" = "5.7.50"
"npm:htmx.org" = "2.0.11"
