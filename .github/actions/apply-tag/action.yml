---
name: apply-tag
description: Create the local release commit and annotated tag for an already-planned tag.
inputs:
  tag:
    description: Tag to create, e.g. v1.2.3.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # main keeps 0.0.0; only the tagged commit carries the version.
        anodizer bump "${TAG#v}" --yes
        cargo update -w
        git commit -am "chore(release): ${TAG}"
        git tag -a "$TAG" -m "$TAG"
