{% extends "layout.html" %}
{% block content %}
<div class="card bg-base-200 shadow-sm max-w-sm mx-auto mt-16">
<div class="card-body items-center text-center">
<h1 class="card-title">Sign in</h1>
<p id="login-help" class="text-sm opacity-70">Use the passkey saved on this device or a security key.</p>
<button id="login" type="button" class="btn btn-primary" autofocus aria-describedby="login-help">Sign in with a passkey</button>
<p id="status" role="status" class="text-error min-h-6"></p>
</div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/webauthn.js?v={{ version }}"></script>{% endblock %}
