[package]
name = "tamis"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "A second-opinion spam filter and mail sorter for remote mailboxes"
repository = "https://github.com/hugoh/tamis"
license = "AGPL-3.0-only"
publish = false

[package.metadata.cargo-machete]
# The crate is imported under its library name, sieve.
ignored = ["sieve-rs"]

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
fastrand = "2.5.0"
getrandom = "0.4.3"
html5ever = "0.40.1"
imap-client = "0.3.1"
jiff = "0.2.39"
keyring = "4.2.0"
keyring-core = "1.0.1"
mail-parser = "0.11.9"
psl = "2.1.246"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
sha2 = "0.11.1"
sieve-rs = "0.7.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
trait-variant = "0.1.3"
unicode-general-category = "1.1.0"
url = "2.5.8"
webauthn-rs = { version = "0.6.2", features = ["preview-features"] }
webauthn-rs-proto = "0.6.2"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
assert_is_empty = "allow"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
