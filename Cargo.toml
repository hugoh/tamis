[package]
name = "tamis"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "A second-opinion spam filter and mail sorter for remote mailboxes"
repository = "https://github.com/hugoh/tamis"
license = "MIT"
publish = false

[dependencies]
html5ever = "0.40.1"
mail-parser = "0.11.9"
psl = "2.1.246"
regex = "1.13.1"
unicode-general-category = "1.1.0"
url = "2.5.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
