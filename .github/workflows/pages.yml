name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, site-docs/**, docs/**, templates/**, src/web/**, web/static/**, mise-tasks/site/**, .github/workflows/pages.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # setup-rust-toolchain defaults this to deny, which would turn rustc warnings into build
  # failures; clippy already gates warnings.
  CARGO_BUILD_WARNINGS: warn

jobs:
  # A path-filtered workflow posts no check on unrelated PRs, so it can't be a
  # required context. Filtering by step instead reports `site-build` as passing
  # without paying for a second runner.
  site-build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            site:
              - site/**
              - site-docs/**
              - docs/**
              - templates/**
              - src/web/**
              - web/static/**
              - mise-tasks/site/**
              - .github/workflows/pages.yml
      - if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        uses: hugoh/gh-workflows/setup@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
        with:
          fetch-depth: "1"
          extra-cache-key-cmd: cat site-docs/package-lock.json
          extra-cache-paths: ~/.npm
      - if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Reuse the e2e job's dev-profile dependency build (saved from main);
          # this job only restores it.
          cache-shared-key: e2e
          cache-save-if: "false"
      - if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        run: mise run site
        env:
          # The runner's own Chrome screenshots the hero image: no browser download.
          TAMIS_E2E_CHANNEL: chrome
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  deploy:
    needs: site-build
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
