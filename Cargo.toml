[package]
name = "tamis"
version = "0.19.2"
edition = "2024"
description = "A spam filter and Sieve mail sorter for remote mailboxes"
repository = "https://github.com/hugoh/tamis"
license = "AGPL-3.0-only"
include = ["/src", "/templates", "/web/static", "/Cargo.lock", "/LICENSE", "/README.md"]
default-run = "tamis"

[package.metadata.cargo-machete]
# The crate is imported under its library name, sieve.
ignored = ["sieve-rs"]

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
axum-server = { version = "0.9.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
fastrand = "2.5.0"
getrandom = "0.4.3"
hex = "0.4.3"
html5ever = "0.40.1"
humantime = "2.4.0"
imap-client = "0.3.1"
jiff = "0.2.40"
keyring = "4.2.0"
keyring-core = "1.0.1"
mail-parser = "1.0.1"
psl = "2.1.248"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
sha2 = "0.11.1"
sieve-rs = "0.7.3"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tower-http = { version = "0.7.1", default-features = false, features = ["compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
trait-variant = "0.1.3"
unicode-general-category = "1.1.0"
unicode-width = "0.2.3"
url = "2.5.8"
webauthn-rs = { version = "0.6.2", features = ["preview-features"] }
webauthn-rs-proto = "0.6.2"
x509-parser = "0.18.1"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
assert_is_empty = "allow"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
