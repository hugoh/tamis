---
name: cross

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - mise.toml
      - .anodizer.yaml
      - .github/workflows/cross.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cross-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - mise.toml
                      - .anodizer.yaml
              - .github/workflows/cross.yml

  anodizer:
    name: anodizer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MISE_ENV: release
    steps:
      - uses: hugoh/gh-workflows/setup@20f042d18e1e5318722f808bafc6d7fc18a838f7 # v1.40.17
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: anodizer-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: anodizer check config
      - name: Build this runner's targets natively
        run: anodizer release --split --snapshot --clean
