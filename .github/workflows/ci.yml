---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: lint
      - run: mise run prebuild
      - uses: hugoh/gh-workflows/hk-check@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: ci
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests and coverage
        run: mise run ci:core

  tag:
    needs: [hk, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    env:
      MISE_ENV: package
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual bump_type dispatch must run on main (got ${GITHUB_REF})"
          exit 1
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: lint
          save-if: "false"
      - name: Semver release
        env:
          BUMP_TYPE: ${{ inputs.bump_type || 'auto' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          args=(--dry-run)
          [ "$BUMP_TYPE" = auto ] || args+=(--default-bump "$BUMP_TYPE")
          plan=$(anodizer tag "${args[@]}")
          part=$(sed -n 's/^part=//p' <<<"$plan")
          tag=$(sed -n 's/^new_tag=//p' <<<"$plan")
          if [ "$part" = none ] || [ -z "$tag" ]; then
            echo "No releasable commits since the last tag"
            exit 0
          fi
          # main keeps 0.0.0; only the tagged commit carries the version.
          anodizer bump "${tag#v}" --yes
          cargo update -w
          git commit -am "chore(release): ${tag}"
          git tag -a "$tag" -m "$tag"
      - name: Validate release
        id: validate
        run: |
          mise run lint-release
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD — skipping release"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Preflight
        if: steps.validate.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: anodizer preflight
      - name: Push tag
        if: steps.validate.outputs.tag != ''
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"

  build:
    name: build (${{ matrix.os }})
    needs: tag
    if: needs.tag.outputs.tag != ''
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MISE_ENV: release,package
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - name: Check out the release tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: git checkout --detach "$TAG"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: anodizer-${{ matrix.os }}
      - name: Build this runner's targets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: anodizer release --split --clean
      - name: Check the binary reports the tag's version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          triple=x86_64-unknown-linux-gnu
          [ "$RUNNER_OS" = macOS ] && triple=aarch64-apple-darwin
          # --split only writes dist/<platform>/context.json; the binary stays in
          # cargo's target/<triple>/release/ until --merge archives it.
          bin=$(find target dist -type f -name tamis -path "*${triple}*" -perm -u=x 2>/dev/null | head -n1)
          [ -n "$bin" ] || { echo "::error::no tamis binary for ${triple} under target/ or dist/"; find target dist -maxdepth 4 -name 'tamis*' 2>/dev/null; exit 1; }
          echo "checking $bin"
          version=$("$bin" --version)
          got=${version#tamis }
          [ "$got" = "${TAG#v}" ] || { echo "::error::tamis --version is '${got}', expected '${TAG#v}'"; exit 1; }
      # Hidden files are dropped by default and would only surface at merge time.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [tag, build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      MISE_ENV: package
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - name: Check out the release tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: git checkout --detach "$TAG"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: lint
          save-if: "false"
      # cargo publish packages the files prebuild generates; they are gitignored,
      # so Cargo.toml's include list is what ships them.
      - name: Generate the embedded web assets
        run: |
          mise run prebuild
          cargo package --list --allow-dirty | grep -qx web/static/vendor/theme.css
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true
      # Artifact transfer drops the execute bit, and the merge runs the binary.
      - name: Restore execute bit
        run: find dist -type f -name tamis -exec chmod +x {} +
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        # The preflight's GitHub push probe reads permissions.push from
        # GET /repos/{owner}/{repo}, which reports false for GITHUB_TOKEN even
        # with contents: write, so it blocks a release the token can create.
        run: anodizer release --merge --skip=preflight --resume-release
      - name: Merge Homebrew tap PR
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          PR_URL=$(gh pr list --repo hugoh/homebrew-tap --state open --json url,headRefName \
            --jq ".[] | select(.headRefName | contains(\"${TAG#v}\")) | .url" | head -1)
          [ -n "$PR_URL" ] || { echo "No open homebrew-tap PR for ${TAG}"; exit 0; }
          gh pr merge "$PR_URL" --repo hugoh/homebrew-tap --squash --delete-branch --auto
