# DO NOT EDIT — managed by hugoh/go-tools via copier.
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/go-tools/.github/workflows/go-hk.yml@8c7fdba46e8aa23effa4c9e355d516396a03fc3a # v1.26.32
    permissions:
      contents: read

  goci:
    uses: hugoh/go-tools/.github/workflows/go-ci.yml@8c7fdba46e8aa23effa4c9e355d516396a03fc3a # v1.26.32
    permissions:
      contents: read

  release:
    needs: [hk, goci]
    uses: hugoh/go-tools/.github/workflows/go-release.yml@8c7fdba46e8aa23effa4c9e355d516396a03fc3a # v1.26.32
    permissions:
      contents: write
    with:
      bump_type: ${{ inputs.bump_type || 'auto' }}
      has_goreleaser: false
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tap_github_token: ${{ secrets.TAP_GITHUB_TOKEN }}
