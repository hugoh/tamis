---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]
      dry_run:
        type: boolean
        description: "Rehearse the release (plan, preflight, tag) without pushing the tag or publishing; allowed on any branch"
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: lint
      - run: mise run prebuild
      - uses: hugoh/gh-workflows/hk-check@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      MISE_ENV: ci
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start Dovecot
        run: mise run test:imap-server
      - name: Fetch CRAP baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run crap:fetch
      - name: Tests and coverage
        run: mise run ci:test
      - name: Record CRAP baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mise run crap:baseline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: crap-baseline
          path: crap-baseline.json
          if-no-files-found: error

  # The browser tests are their own job so they run beside `test` instead of
  # after it, and they are skipped when nothing the web interface depends on
  # changed. A skipped step still leaves the job green for `tag`.
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The runner's own Chrome: no browser download.
      TAMIS_E2E_CHANNEL: chrome
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - name: Did the web interface change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "origin/${BASE}...HEAD" |
            grep -Eq '^(templates/|web/|site/|src/(web|health|live|store|rules|config)/|mise-tasks/(web|site|test)/|\.config/mise/|\.github/|Cargo\.(toml|lock)$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No web interface changes: skipping the browser tests"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/rust-setup
        with:
          shared-key: e2e
          minimal: "true"
      - name: Browser tests
        if: steps.changes.outputs.run == 'true'
        run: mise run test:e2e

  plan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.dry_run
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual bump_type dispatch must run on main (got ${GITHUB_REF})"
          exit 1
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - name: Plan the release
        id: plan
        env:
          BUMP_TYPE: ${{ inputs.bump_type || 'auto' }}
        run: |
          args=(--dry-run)
          [ "$BUMP_TYPE" = auto ] || args+=(--default-bump "$BUMP_TYPE")
          plan=$(anodizer tag "${args[@]}")
          part=$(sed -n 's/^part=//p' <<<"$plan")
          tag=$(sed -n 's/^new_tag=//p' <<<"$plan")
          if [ "$part" = none ] || [ -z "$tag" ]; then
            echo "No releasable commits since the last tag"
            exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  preflight:
    needs: plan
    if: needs.plan.outputs.tag != ''
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Same scopes as the old in-tag preflight: id-token for the crates.io OIDC
    # check, contents: write so the GitHub push probe passes.
    permissions:
      contents: write
      id-token: write
    env:
      MISE_ENV: package
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: lint
          save-if: "false"
      - uses: ./.github/actions/apply-tag
        with:
          tag: ${{ needs.plan.outputs.tag }}
      - name: Preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: anodizer preflight

  tag:
    needs: [plan, hk, test, e2e, preflight]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      # Empty on a dry run, so build and release are skipped.
      tag: ${{ !inputs.dry_run && steps.validate.outputs.tag || '' }}
    env:
      MISE_ENV: package
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - uses: ./.github/actions/rust-setup
        with:
          cache: "false"
      - uses: ./.github/actions/apply-tag
        with:
          tag: ${{ needs.plan.outputs.tag }}
      - name: Validate release
        id: validate
        run: |
          mise run lint:release
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD — skipping release"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Push tag
        if: steps.validate.outputs.tag != '' && !inputs.dry_run
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"

  build:
    name: build (${{ matrix.os }})
    needs: tag
    if: needs.tag.outputs.tag != ''
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MISE_ENV: release,package
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - name: Check out the release tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: git checkout --detach "$TAG"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: anodizer-${{ matrix.os }}
      - name: Build this runner's targets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: anodizer release --split --clean
      - name: Check the binary reports the tag's version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          triple=x86_64-unknown-linux-gnu
          [ "$RUNNER_OS" = macOS ] && triple=aarch64-apple-darwin
          # --split only writes dist/<platform>/context.json; the binary stays in
          # cargo's target/<triple>/release/ until --merge archives it.
          bin=$(find target dist -type f -name tamis -path "*${triple}*" -perm -u=x 2>/dev/null | head -n1)
          [ -n "$bin" ] || { echo "::error::no tamis binary for ${triple} under target/ or dist/"; find target dist -maxdepth 4 -name 'tamis*' 2>/dev/null; exit 1; }
          echo "checking $bin"
          version=$("$bin" --version)
          got=${version#tamis }
          [ "$got" = "${TAG#v}" ] || { echo "::error::tamis --version is '${got}', expected '${TAG#v}'"; exit 1; }
      # Hidden files are dropped by default and would only surface at merge time.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [tag, build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      MISE_ENV: package
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "0"
      - name: Check out the release tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: git checkout --detach "$TAG"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: lint
          save-if: "false"
      # cargo publish packages the files prebuild generates; they are gitignored,
      # so Cargo.toml's include list is what ships them.
      - name: Check the crate ships the embedded web assets
        run: mise run lint:package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true
      # Artifact transfer drops the execute bit, and the merge runs the binary.
      - name: Restore execute bit
        run: find dist -type f -name tamis -exec chmod +x {} +
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        # The preflight's GitHub push probe reads permissions.push from
        # GET /repos/{owner}/{repo}, which reports false for GITHUB_TOKEN even
        # with contents: write, so it blocks a release the token can create.
        run: anodizer release --merge --skip=preflight --resume-release
      - name: Merge Homebrew tap PR
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          PR_URL=$(gh pr list --repo hugoh/homebrew-tap --state open --json url,headRefName \
            --jq ".[] | select(.headRefName | contains(\"${TAG#v}\")) | .url" | head -1)
          [ -n "$PR_URL" ] || { echo "No open homebrew-tap PR for ${TAG}"; exit 0; }
          gh pr merge "$PR_URL" --repo hugoh/homebrew-tap --squash --delete-branch --auto
