dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

protocols = imap
first_valid_uid = 100
first_valid_gid = 100
log_path = /dev/stderr
auth_allow_cleartext = yes
ssl = no

mail_driver = maildir
mail_path = /tmp/mail/%{user}
mail_uid = dovecot
mail_gid = dovecot

passdb static {
  password = secret
}

userdb static {
  fields {
    home = /tmp/mail/%{user}
  }
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox "Sent Messages" {
    special_use = \Sent
    auto = create
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}
